ted, so the settings are frozen. This screen is here to look at them, not to change them.","setup.lockedByImport":"The fields are locked because they came from a pasted code. Changing them would make your game differ from your opponent’s.","setup.unlockedWarning":"You are editing settings that came from a pasted code. Your two devices no longer agree — paste the code again to get back in step.","setup.continue":"Continue to building","setup.readyToBuild":"Settings are ready.","setup.needSettings":"Create a settings code or paste the one your opponent sent.","setup.firstMovePlayer1":"Player 1","setup.firstMovePlayer2":"Player 2","build.myBoardTitle":"My maze","build.myBoardLabel":"My maze, the one my opponent walks through","build.myBoardHint":"Click an edge to raise a wall, click it again to take it down. Your opponent walks this maze.","build.modeWalls":"Walls","build.modeEntrance":"Place entrance","build.modeExit":"Place exit","build.wallCounter":"Walls {count} / {limit}","build.undo":"Undo","build.reset":"Clear the maze","build.timerLeft":"Build time left {clock}","build.timerExpired":"Build time is up. Nothing is blocked.","build.timerOff":"Build timer is off.","build.opponentBoardTitle":"Opponent's maze","build.opponentBoardLabel":"The opponent's maze, walls unknown","build.opponentBoardHint":"Mark the entrance and the exit your opponent announced. The walls stay hidden until the reveal.","build.opponentEnds":"Entrance {entrance}, exit {exit}","build.commitTitle":"Commit","build.commitExplain":"Freezing takes a random salt, hashes it together with your maze and produces a commit. The commit gives nothing away, and it makes changing the maze afterwards impossible to hide. The code goes to your opponent; the file below stays with you.","build.freeze":"Freeze the maze","build.unfreeze":"Change the maze","build.commitPending":"The maze must be valid before it can be frozen.","build.commitDone":"The maze is frozen. Send the commit code to your opponent.","build.unfr  reveal, and a player who cannot reveal loses by the rules.","build.gameStarted":"The game has started, so the maze is frozen for good. Changing a wall now would rewrite a game that is already being played.","build.backToGame":"Back to the game","play.yourTurn":"Your move","play.theirTurn":"Opponent's move","play.statusOut":"You are out","play.status":"{turn} · move {move} · round {round} · new cells {cells}/{limit}","play.myMazeTitle":"My maze · opponent walks here","play.opponentMazeTitle":"Opponent's maze · you walk here","play.helpSummary":"How a turn is entered","play.helpMine":"Your move: click one of the highlighted neighbouring cells on the right board, then say what your opponent answered.","play.helpTheirs":"Opponent's move: click the cell they named on the left board. The answer comes from your own walls, and the line to read out loud appears above.","play.helpAuto":"An edge you have already walked through is answered from your own map: your opponent said it once and is not asked again. A wall you already know is never assumed - it is offered for confirmation, because such a step ends your turn.","play.helpKeys":"Keys: arrows or WASD to step, P or 1 for passed, B or 2 for wall, Escape to choose another step. Enter is not bound to any answer on purpose.","play.chooseYourStep":"Choose your step","play.chooseTheirStep":"Enter the step your opponent named","play.askAnswer":"You step {from} → {to}. What did your opponent answer?","play.askAnswerHint":"P or 1 for passed, B or 2 for wall. Enter is deliberately not bound: an answer goes into the journal and cannot be argued away later.","play.answerPassed":"Passed (P)","play.answerWalled":"Wall (B)","play.cancelStep":"Choose another step (Esc)","play.undoStepMine":"Take my step back","play.undoStepTheirs":"Take opponent's step back","play.confirmWall":"Yes, it is a wall (B)","play.confirmWallQuestion":"You already know {from} → {to} is a wall. The turn would end there.","play.confirmWallHint":"Nothing is blocked, DICT":"The verdict","check.ok":"Matches.","check.computed":"computed","check.skipped.EARLIER_CHECK":"Skipped: an earlier check did not pass, so this one would prove nothing.","check.skipped.NO_GAME":"Skipped: this device has no finished game to judge.","check.fail.DAMAGED":"The code was damaged while copying. Ask for it to be sent again.","check.fail.NOT_A_REVEAL":"This is not a reveal string, or it was not pasted in full.","check.fail.COMMIT":"The commit does not match: either the code was entered with a mistake, or the maze is not the one that was committed to.","check.fail.SETTINGS":"The settings inside the reveal are not the ones this game was played under.","check.fail.ENDS":"The announced ends were {declaredEntrance} and {declaredExit}; the reveal carries {revealedEntrance} and {revealedExit}.","check.fail.MAZE":"The revealed maze breaks the rules a maze has to follow.","check.fail.ANSWERS":"Answers that do not match the revealed maze: {count}.","check.fail.UNKNOWN":"This check did not pass.","status.ok":"ok","status.fail":"failed","status.skipped":"skipped","verdict.win":"You win","verdict.loss":"You lose","verdict.draw":"A draw","verdict.bothLose":"Both lose","verdict.none":"No verdict","verdict.reason.VIOLATION":"A check did not pass, which decides the game by the rules.","verdict.reason.BOTH_VIOLATED":"Neither reveal held up.","verdict.reason.RESIGN":"By resignation.","verdict.reason.BOTH_RESIGNED":"Both players resigned.","verdict.reason.NO_EXIT_REACHED":"Nobody reached the exit.","verdict.reason.ONLY_ONE_REACHED_EXIT":"Only one pawn reached its exit.","verdict.reason.SAME_ROUND":"Both reached the exit in the same round.","verdict.reason.EARLIER_ROUND":"The exit was reached in an earlier round.","verdict.reason.EARLIER_MOVE":"The exit was reached on an earlier move.","verdict.reason.UNKNOWN":"The core gave a reason this version does not know about.","rules.title":"Rules","rules.close":"Back","rules.intro":"Each of you builds a maze and then walks the other one blind: you name a step, your opponent says whether it is open or a wall, and you map their maze as you go. Getting your piece from their entrance to their exit, before they do the same in yours, is what wins the game. One rule matters above the rest: you may not lie about your walls. The application is a helper, not a referee — it warns you, it never stops you. Nothing is judged while you play. Before the first move each of you seals a maze; when the game is over you show each other what was inside, and the seals are checked.","rules.quickStart.title":"How a game goes","rules.quickStart.intro":"The whole game, from sitting down to knowing who won.","rules.quickStart.step1":"Agree on the settings. One of you creates a settings code and sends it over; the other pastes it in.","rules.quickStart.step2":"Build your own maze on the left board: an entrance, an exit, and walls between the cells.","rules.quickStart.step3":"Tell each other where your entrance and exit are, and mark your opponent’s on the right board. Those two cells are not a secret; the walls are.","rules.quickStart.step4":"Lock your maze in. The application seals it, gives you a commit code, and asks you to save a reveal file. Save it.","rules.quickStart.step5":"Send your commit code, paste the one you were sent. It is checked the moment it arrives.","rules.quickStart.step6":"Play. You say your step out loud; your opponent tells you whether the way is open or a wall stands there.","rules.quickStart.step7":"When the game is over, send each other the reveal string from the file you saved.","rules.quickStart.step8":"Paste the reveal you were sent. The report replays the whole game against the maze that was sealed and tells you what it found.","rules.quickStart.codes":'Nothing here talks to a network. Every code you "send" you send yourself — in a messenger, in a chat, read out over a call. The application only makes those codes and checks the ones you paste back in.',"rules.board.title":"The board and your maze","rules.board.grid":"The board is six cells by six. Rows are lettered A to F from the top, columns numbered 1 to 6 from the left, so C3 is the third row and the third column. Pieces move up, down, left and right — never diagonally.","rules.board.walls":"A wall stands on the edge between two neighbouring cells, not inside a cell, and it blocks the way in both directions. There are sixty such edges. The outer border is solid everywhere: nothing ever leaves the board, and no wall is placed there.","rules.board.limit":"You have a wall budget — twenty by default, and one of the settings you agree on. You do not have to spend all of it.","rules.board.ends":"Your maze has exactly one entrance and one exit, and they are different cells. You choose both, and you say them out loud before the game: your opponent needs them to know where their piece starts and where it is going.","rules.board.path":"There has to be at least one way from your entrance to your exit. Dead ends and pockets nobody can reach are fine. A maze with no way through is not a maze, it is a wall with decorations.","rules.board.invalid":"A game cannot start on a maze that breaks one of those rules: no entrance or no exit, both on the same cell, more walls than the budget, an entrance or an exit shut in on every side, or no path from one to the other. Everything wrong is listed at once, so it can be fixed in one pass.","rules.turn.title":"Your turn","rules.turn.first":"The settings decide who moves first. Your piece starts on your opponent’s entrance and is making for their exit; theirs starts on yours and is making for your exit. Nobody walks their own maze — you already know where your walls are.","rules.turn.step":"A step is one move into a neighbouring cell. You say it out loud, and your opponent answers with what is there: the way is open, or a wall. Both of you write down both sides — your own steps on the right board, your opponent’s on the left — so each device carries the whole game.","rules.turn.clock":"The clocks are there to be looked at. Neither the one on the building screen nor the one on a turn blocks anything or ends anything: running out of time costs you nothing at all.","rules.turn.rightBoard":"The right board starts empty and fills in as you go: it shows only what you have found out yourself — the cells you have stood on, the ways you have walked through, the walls you have run into. That slow uncovering is the game.","rules.turn.theirTurn":"On your opponent’s turn they name their step and you answer it: you are the only one who can see your maze. On your device you enter the direction they took and nothing else — your walls are already in there, so the answer follows by itself.","rules.turn.end":"A turn does not end on its own. When you have gone as far as you want, or the application says the turn is technically over, you hand it over — that is what writes the turn into the record and passes the move on. There is a switch that hands it over by itself once the turn is technically over; it is a convenience of your device alone and changes nothing about the game.","rules.turn.newCells":"A turn gives you three new cells by default. Stepping onto a cell you have never stood on spends one of them; when they are gone, the turn is over.","rules.turn.wall":"A wall ends the turn on the spot. Your piece stays where it was, the wall is marked on the board for both of you, and it costs none of your new cells. Learning where a wall is, is what a turn is for.","rules.turn.visited":"Walking back over cells you have already stood on costs nothing at all. Only new ground is rationed, so there is no reason to be afraid of retracing your way.","rules.turn.known":"The application remembers every answer, so your opponent is never asked the same thing twice. A way you have already walked through is simply taken. A wall you have already found needs one confirmation before you walk into it, because that step ends your turn and a slip of the mouse should not cost a turn.","rules.turn.override":"If your opponent says something different this time — people misremember — there is a small way to ask the question again next to any step that was answered from memory. The earlier step is taken back and both the step and the correction stay in the record.","rules.turn.pass":"Skipping a turn is not allowed unless the settings say it is. A skip still counts as a turn: it raises your count and it comes out of the total the game is capped at.","rules.turn.undo":"A step can be taken back while the turn is still open; once a turn is handed over, only the whole turn can be taken back. Nothing is ever erased — the record keeps the move and the taking back side by side, so the two of you can always see what really happened.","rules.end.title":"How a game ends","rules.end.exit":"Reaching the exit does not end the game. The move you first stood on it is written down, and that number is what decides the result later.","rules.end.limit":"The game is capped at 150 moves by both players together, by default. The application says when the cap is reached.","rules.end.afterExit":'One setting decides how two finishes are compared. With "Play continues after the exit is reached" on, what counts is the round each of you reached it in — a round is one move by each player — and the same round is a draw. With it off, the exact move number decides and a draw is impossible.',"rules.end.resign":"You can resign. It takes two presses and it cannot be taken back: a resignation is a statement, not a move.","rules.end.resignThem":"If your opponent resigns out loud, record it on your device too. A resignation nobody wrote down is a resignation the check never sees, and the verdict comes out as if the game had just stopped in the middle.","rules.end.again":"After the report there is a way to start another game under the same settings. Take it: it draws a new game number, and with it a new settings code that has to be sent to your opponent before either of you builds anything. Play a rematch on the old code and the third check will not match at the end — a whole game played for nothing.","rules.end.verdict":"Nothing is judged while you play. The result is worked out at the verification step, from the sealed mazes and the answers that were given.","rules.commit.title":"Sealing your maze, and showing it afterwards","rules.commit.why":"You may not lie about your walls, and the game would be unplayable if nobody could tell whether you did. So before the first move each of you seals their maze: the application takes your maze, your settings and a random number, and boils them down to one short code — the commit.","rules.commit.nothing":"The commit gives nothing away: nobody can read your walls out of it. What it does is tie you to the maze you have. There is no maze you can invent afterwards that fits the code you already sent.","rules.commit.envelope":"Think of an envelope. The commit is the wax seal on the outside: you send your opponent a picture of the seal, it tells them nothing about the letter, and swapping the letter afterwards would break it. The reveal is the letter itself. Two different things, made in the same moment on the same screen — one is sent, one is saved.","rules.commit.which":"The commit code goes to your opponent before the first move, and theirs comes to you. The reveal file goes onto your own disk and stays there until the game has been checked: it is not sent anywhere and nobody but you ever sees it during the game.","rules.commit.exchange":"You exchange commits before the first move, and each one is checked the moment it is pasted. A code with a character lost on the way is caught right then, while you can still ask for it again — not at the end of the game, when a broken code looks like something far worse.","rules.commit.file":"The reveal is your maze and that random number written out in full. The application makes you save it as a file before the game starts, because the random number exists nowhere else: not on a server, not in the code you sent, only in that file and in this browser.","rules.commit.lost":"Lose the file and clear the page, and you cannot reveal at all. By the rules, a player who cannot reveal loses. Keep the file until the game has been checked and you both agree on the result.","rules.commit.after":"When the game is over, send each other the reveal string. Then either of you can check the other, and neither can change anything.","rules.verify.title":"The check at the end","rules.verify.intro":"Paste the reveal you were sent, and seven things are checked in order. Each one is shown with what it found.","rules.verify.check1":"the string arrived whole: nothing is missing and its checksum agrees.","rules.verify.check2":"the maze in the reveal is the maze that was sealed before the first move.","rules.verify.check3":"you both played under the same agreed settings, and under the same game number.","rules.verify.check4":"the entrance and the exit are the ones that were announced out loud.","rules.verify.check5":"the revealed maze obeys the rules: the wall budget, open ends, a way through.","rules.verify.check6":"every answer given during the game is replayed against the revealed maze, move by move.","rules.verify.check7":"the result of the game, worked out from everything above.","rules.verify.damaged":"A string that fails the first check was damaged on the way: copied short, folded by a messenger, a character dropped. That is not an accusation and it is not treated as one — ask for the string again.","rules.verify.commitFailed":"If the seal does not match, the application says only that: either the string was entered wrong, or the maze that was revealed is not the maze that was sealed. Which of the two it is, nobody can tell from here.","rules.verify.mismatch":"A mismatch in the sixth check means an answer given during the game does not agree with the revealed maze — a wall where the maze is open, or an open way where the maze has a wall. Repeats on the same edge are gathered into one line, because one wrong answer about a busy edge shows up every time anyone walks there. By the rules, a player caught this way loses the game.","rules.verify.replay":"Under the report the whole game can be stepped through, move by move, on the maze as it really was.","rules.limits.title":"What this cannot do","rules.limits.intro":"The seal makes one particular lie impossible. It does not make the game unbreakable, and it is worth knowing where it stops.","rules.limits.noReveal":"If your opponent never sends a reveal, nothing can be proved. The application sees an empty field and nothing more. The rules say a player who does not reveal loses, and there is a button to record that — clearly marked as your statement rather than as a computed result.","rules.limits.dispute":"Everything said during the game is written down on your own device only. If you disagree afterwards about who said what, no amount of checking will settle it: there is no server and no shared record.","rules.limits.lostFile":"A lost reveal file cannot be rebuilt from anything. The random number in it is not stored anywhere else.","rules.glossary.title":"The four words","rules.glossary.settingsCodeTerm":"Settings code","rules.glossary.settingsCode":"The short code carrying the settings you agreed on and the number of this particular game. Both of you must be playing under the same one.","rules.glossary.commitTerm":"Commit","rules.glossary.commit":"The seal of your maze, sent before the first move. It says nothing about your walls and cannot be made to fit another maze.","rules.glossary.revealTerm":"Reveal","rules.glossary.reveal":"Your maze and its random number written out in full, sent after the game. This is what the seal is checked against.","rules.glossary.saltTerm":"Salt","rules.glossary.salt":"The random number that goes into the seal. Without it, two identical mazes would give the same commit, and anyone could find a maze by trying them all."};var Mr={"lang. ady":"Код создан. Отправьте его сопернику.","setup.codeStale":"Настройка изменилась, и старый код её больше не описывает. Создайте новый.","setup.fixFields":"Некоторые поля вне своих диапазонов.","setup.importTitle":"Вставить код настроек","setup.importLabel":"Код настроек соперника","setup.importHint":"Вставка кода заменяет все поля, включая номер партии.","setup.importAccepted":"Код принят. Поля ниже теперь совпадают с соперником.","setup.lockedByGame":"Партия началась, поэтому настройки заморожены. Этот экран здесь, чтобы на них смотреть, а не менять их.","setup.lockedByImport":"Поля заперты, потому что пришли из вставленного кода. Их изменение развело бы вашу партию с партией соперника.","setup.unlockedWarning":"Вы правите настройки, пришедшие из вставленного кода. Два устройства больше не согласованы — вставьте код заново, чтобы вернуться в лад.","setup.continue":"Перейти к постройке","setup.readyToBuild":"Настройки готовы.","setup.needSettings":"Создайте код настроек или вставьте тот, что прислал соперник.","setup.firstMovePlayer1":"Игрок 1","setup.firstMovePlayer2":"Игрок 2","build.myBoardTitle":"Мой лабиринт","build.myBoardLabel":"Мой лабиринт, по нему идёт соперник","build.myBoardHint":"Клик по ребру ставит стену, повторный клик убирает. По этому лабиринту ходит соперник.","build.modeWalls":"Стены","build.modeEntrance":"Поставить вход","build.modeExit":"Поставить выход","build.wallCounter":"Стены {count} / {limit}","build.undo":"Отменить","build.reset":"Очистить лабиринт","build.timerLeft":"До конца постройки {clock}","build.timerExpired":"Время постройки вышло. Ничего не заблокировано.","build.timerOff":"Таймер постройки выключен.","build.opponentBoardTitle":"Лабиринт соперника","build.opponentBoardLabel":"Лабиринт соперника, стены неизвестны","build.opponentBoardHint":"Отметьте вход и выход, которые назвал соперник. Стены останутся скрытыми до раскрытия.","build.opponentEnds":"Вход {entrance}, выход {exit}","build.commitTitle":"Печать","build.commitExplain":"При фиксации берётся случайная соль, хешируется вместе с вашим лабиринтом и даёт печать. Печать ничего не выдаёт, но после неё лабиринт нельзя подменить незаметно. Код уходит сопернику; файл ниже остаётся у вас.","build.freeze":"Зафиксировать лабиринт","build.unfreeze":"Изменить лабиринт","build.commitPending":"Прежде чем фиксировать, лабиринт должен стать годным.","build.commitDone":"Лабиринт зафиксирован. Отправьте код печати сопернику.","build.unfrozen":"Печать и соль стёрты. Сохранённый файл раскрытия теперь бесполезен.","build.commitLabel":"Код печати для отправки","build.commitHint":"74 символа, вместе с контрольной суммой.","build.revealTitle":"Файл раскрытия","build.revealExplain":"В файле лежат ваш лабиринт, соль и настройки. Он понадобится после партии, чтобы доказать: стены были те самые, на которые вы дали печать.","build.revealWarning":"Сохраните его сейчас. Потеря этого файла означает, что раскрыться нечем, а не раскрывшийся проигрывает по правилам.","build.saveReveal":"Сохранить файл раскрытия","build.revealNeedsCommit":"Сначала зафиксируйте лабиринт.","build.revealSaved":"Файл раскрытия сохранён.","build.revealFailed":"Браузер отказался сохранить файл. Попробуйте ещё раз или другой браузер.","build.noSettingsCode":"(на этом устройстве нет кода настроек)","build.opponentCommitTitle":"Печать соперника","build.opponentCommitLabel":"Вставьте присланный код печати","build.opponentCommitHint":"Он проверяется сразу при вставке. Поймать опечатку сейчас стоит минуты; поймать её после партии выглядит как обвинение.","build.opponentCommitAccepted":"Код печати цел и сохранён.","build.startTitle":"Начать партию","build.checkMaze":"Мой лабиринт валиден и зафиксирован","build.checkOpponentEnds":"Вход и выход соперника отмечены и не совпадают","build.checkReveal":"Файл раскрытия сохранён","build.checkOpponentCommit":"Код печати соперника принят","build.start":"Начать партию","build.back":"Назад к настройкам","reveal.fileTitle":"Usogui Maze yev — файл раскрытия. зан намеренно: ответ попадает в запись партии, и оспорить его потом нельзя.","play.answerPassed":"Проход (P)","play.answerWalled":"Стена (B)","play.cancelStep":"Выбрать другой шаг (Esc)","play.undoStepMine":"Отменить свой шаг","play.undoStepTheirs":"Отменить шаг соперника","play.confirmWall":"Да, там стена (B)","play.confirmWallQuestion":"Вы уже знаете, что {from} → {to} — стена. Ход на этом закончится.","play.confirmWallHint":"Ничего не запрещено, но и ничего не подставляется само: шаг в уже найденную стену заканчивает ход, поэтому он делается только осознанно.","play.fromMap":"По вашей карте: {from} → {to} — проход","play.fromMapHint":"Соперник уже отвечал про это ребро, поэтому его не спрашивали снова. Такой шаг никогда не открывает новую клетку и ничего не тратит.","play.overrideAuto":"Соперник ответил иначе","play.timerOver":"Таймер хода +{clock}","play.finishGame":"Завершить партию","play.finishWhy":"Сдачу надо записать здесь, чья бы она ни была. Без записи проверка посчитает партию так, будто никто не сдавался, и получит неверный итог.","play.finished":"Вы сдались","play.finishedHint":"Это устройство вышло из партии. Вердикт — ваш или соперника — считается на этапе проверки, и раскрытиями обменяться всё равно придётся.","play.passMine":"Пропустить свой ход","play.passTheirs":"Пропустить ход соперника","play.sayPass":"СКАЖИ: ПРОХОД","play.sayWall":"СКАЖИ: СТЕНА {from}-{to}","play.endTurn":"Передать ход","play.undo":"Отменить ход","play.resign":"Сдаться","play.resignThem":"Записать сдачу соперника","play.resignThemConfirm":"Да, записать сдачу соперника","play.resignThemWarning":"Нажмите ещё раз, чтобы записать сдачу соперника. Она войдёт в партию и решит её в вашу пользу.","play.theyResigned":"Сдача соперника записана. Вердикт считается на этапе проверки.","play.finishedThem":"Сдача соперника","play.finishedThemHint":"Партия окончена. Раскрытиями всё равно обмениваются: вердикт считается на этапе проверки.","play.handedOverWall":"Ход передан: стена {from}-{to}","play.handedOverCells":"Ход передан: новые клетки этого хода израсходованы","play.resignConfirm":"Сдаться по-настоящему","play.resignWarning":"Нажмите ещё раз, чтобы сдаться. Это записывается и решает партию против вас.","play.resigned":"Вы сдались. Вердикт считается на этапе проверки.","play.toVerify":"К проверке","play.counters":"Я: {mine} | Соперник: {theirs}","play.limit":"Ходов сделано {total} из {limit}.","play.noLimit":"Ходов сделано {total}. В этой партии лимита ходов нет.","play.timerLeft":"Таймер хода {clock}","play.historyMine":"Мои ходы","play.historyTheirs":"Ходы соперника","play.historyEmpty":"Пока пусто.","play.problemTitle":"Партию не удалось восстановить","play.journalBroken":"Сохранённую партию не удалось проиграть заново, и её оставили нетронутой. Партию можно начать сначала, с первого хода. Подробности: {message}","play.journalDropped":"Сохранённая партия оказалась повреждена, и её пришлось отбросить. Подготовка цела, так что партию можно начать сначала, с первого хода.","play.actionRefused":"Ядро отказало в этом действии — значит, экран предложил то, чего не должен был. Ничего не записано. Подробности: {message}","play.setupMissing":"Нет настроек, вашего лабиринта или объявленных входа и выхода, так что играть нечего. Вернитесь к постройке.","play.restart":"Начать партию заново","history.step":"{from}-{to}","history.wallStep":"стена {from}-{to}","history.pass":"ПРОПУСК","history.undo":"ОТМЕНЕНО","history.stepTakenBack":"ШАГ ОТМЕНЁН: {from}-{to}","history.resign":"СДАЧА","history.noSteps":"без шагов","hint.TURN_OVER_WALL":"Стена. Ход окончен, фишка осталась на месте.","hint.TURN_OVER_NEW_CELLS":"Запас новых клеток на этот ход израсходован. Ход окончен.","hint.REACHED_EXIT":"Выход достигнут. Партия на этом не останавливается.","hint.KNOWN_WALL_WARNING":"Эта стена уже известна. Шаг всё равно разрешён.","hint.MOVE_LIMIT_REACHED":"Лимит ходов этой партии достигнут. Ничего не заблокировано.","hint.PASS_NOT_ALLOWED":"Пропуск хода выключен в настройках этой партии.","hint.EMPTY_TURN_WARNING":"Ход без единого шага противоречит правилам, но он записан.","hint.UNKNOWN":"Ядро вернуло подсказку, которой эта версия не знает.","verify.myRevealTitle":"Ваше раскрытие","verify.myRevealExplain":"Отправьте эту строку сопернику. Она доказывает, что лабиринт, по которому играли, — тот самый, на который вы дали печать до первого хода.","verify.myRevealLabel":"Ваша строка раскрытия","verify.myRevealHint":"68 символов, вместе с контрольной суммой.","verify.myRevealLost":"Это устройство больше не может собрать вашу строку раскрытия ({message}). Возьмите её из файла, сохранённого до партии, и вставьте ниже.","verify.myRevealPasteLabel":"Вставьте своё раскрытие из сохранённого файла","verify.myRevealPasteHint":"Файл — обычный текст; нужна строка, которая начинается с YMR1.","verify.myRevealPasteAccepted":"Это годная строка раскрытия. Отправьте её сопернику.","verify.saveAgain":"Сохранить файл заново","verify.noRevealRule":"Не раскрывшийся проигрывает по правилам, так что не потеряйте этот файл до обмена.","verify.theirRevealTitle":"Раскрытие соперника","verify.theirRevealLabel":"Вставьте присланную строку раскрытия","verify.theirRevealHint":"Она проверяется сразу при вставке.","verify.theirRevealAccepted":"Строка раскрытия цела. Отчёт ниже.","verify.noReveal":"Соперник ничего не прислал","verify.noRevealConfirm":"Записать, что ничего не пришло","verify.noRevealWarning":"Нажмите ещё раз, чтобы это записать. Убедитесь, что действительно дождались, — проверить это больше некому.","verify.noRevealDeclared":"Вы записали, что раскрытие не пришло.","verify.noRevealNotProof":"Это ваше заявление, а не проверка. Приложение не может увидеть, отправляли раскрытие или нет; по правилам не раскрывшийся проигрывает, и строка выше говорит именно это.","verify.noCommitTitle":"Сверять не с чем","verify.noCommitText":"На это устройство так и не попал код печати соперника, поэтому раскрытие не с чем сравнивать. Печать — это код YMC1, присланный до первого хода; введите его на экране постройки и возвращайтесь.","verify.subject":"Проверяется печать {commit} · объявлены вход {entrance} и выход {exit} · настройки {settings}","verify.gameRunning":"Партия ещё идёт — никто не сдался. Всё, что ниже, посчитано по сделанным ходам, и вердикт будет меняться по ходу партии. Проверка сейчас ничего не доказывает про остаток.","verify.passedSummary":"Пройдено проверок: {count}","verify.reviewedTitle":"Эта партия разобрана","verify.reviewedText":"Отчёт выше. Больше с этой партией делать нечего: храните файл раскрытия, пока оба не согласитесь с итогом.","verify.nextGame":"Новая партия, те же правила","verify.nextGameWarning":"У новой партии новый номер, а значит и новый код настроек — отправьте его сопернику до постройки. Пропустите это, и третья проверка в конце не сойдётся: партия сыграна впустую у обоих.","verify.reportTitle":"Отчёт","verify.reportEmpty":"Вставьте присланную строку раскрытия, и здесь пройдут семь проверок.","verify.mismatchLine":"{from}-{to}: сказано {declared}, в раскрытом лабиринте {actual}. Раз: {count}.","verify.mismatchMoves":"ходы ({count})","verify.wordWall":"стена","verify.wordPass":"проход","verify.myBoardTitle":"Мой лабиринт","verify.theirBoardTitle":"Лабиринт соперника","verify.theirBoardHint":"После успешной проверки лабиринт рисуется целиком, а поверх — то, что вы разведали за партию. Рёбра, где ответ не сошёлся, подсвечены.","verify.replayTitle":"Реплей","verify.replayHint":"Пройдите законченную партию по шагам. Здесь ничего не меняется.","verify.replayStart":"В начало","verify.replayBack":"Назад","verify.replayForward":"Вперёд","verify.replayPlay":"Проиграть","verify.replayPause":"Пауза","verify.replayEnd":"В конец","verify.replayAt":"действие {at} из {total}","verify.noGameTitle":"На этом устройстве нет законченной партии","verify.noGameText":"Отчёту нужна партия, о которой он. Сыграйте партию или восстановите это устройство с экрана настроек.","check.CODE_INTEGRITY":"Сам код раскрытия","check.COMMIT_MATCH":"Печать","check.SETTINGS_MATCH":"Настройки","check.ENDPOINTS_MATCH":"Объявленные вход и выход","check.MAZE_VALID":"Лабиринт валиден по правилам","check.LOG_REPLAY":"Все ответы, проигранные заново","check.VERDICT":"Вердикт","check.ok":"Сходится.","check.computed":"посчитан","check.skipped.EARLIER_CHECK":"Пропущено: не прошла более ранняя проверка, так что эта ничего бы не доказала.","check.skipped.NO_GAME":"Пропущено: на этом устройстве нет законченной партии, чтобы судить.","check.fail.DAMAGED":"Код повреждён при копировании. Попросите прислать его заново.","check.fail.NOT_A_REVEAL":"Это не строка раскрытия или она вставлена не целиком.","check.fail.COMMIT":"Печать не сошлась: либо код введён с ошибкой, либо лабиринт не тот, на который была дана печать.","check.fail.SETTINGS":"Настройки внутри раскрытия — не те, под которыми игралась эта партия.","check.fail.ENDS":"Объявлены были {declaredEntrance} и {declaredExit}; в раскрытии стоят {revealedEntrance} и {revealedExit}.","check.fail.MAZE":"Раскрытый лабиринт нарушает правила, которым лабиринт обязан следовать.","check.fail.ANSWERS":"Ответов, не сошедшихся с раскрытым лабиринтом: {count}.","check.fail.UNKNOWN":"Эта проверка не прошла.","status.ok":"сошлось","status.fail":"не сошлось","status.skipped":"пропущено","verdict.win":"Вы выиграли","verdict.loss":"Вы проиграли","verdict.draw":"Ничья","verdict.bothLose":"Проиграли оба","verdict.none":"Вердикта нет","verdict.reason.VIOLATION":"Проверка не прошла, и по правилам это решает партию.","verdict.reason.BOTH_VIOLATED":"Ни одно раскрытие не выдержало проверки.","verdict.reason.RESIGN":"По сдаче.","verdict.reason.BOTH_RESIGNED":"Сдались оба.","verdict.reason.NO_EXIT_REACHED":"До выхода не дошёл никто.","verdict.reason.ONLY_ONE_REACHED_EXIT":"До своего выхода дошла только одна фишка.","verdict.reason.SAME_ROUND":"Оба дошли до выхода в одном круге.","verdict.reason.EARLIER_ROUND":"До выхода дошли в более раннем круге.","verdict.reason.EARLIER_MOVE":"До выхода дошли на более раннем ходу.","verdict.reason.UNKNOWN":"Ядро назвало причину, которой эта версия не знает.","rules.title":"Правила","rules.close":"Назад","rules.intro":"Каждый строит свой лабиринт, а потом идёт по чужому вслепую: вы называете шаг, соперник говорит, проход там или стена, и вы понемногу составляете карту его лабиринта. Победа — провести свою фишку от его входа до его выхода раньше, чем соперник сделает то же в вашем. Одно правило важнее прочих: врать про свои стены нельзя. Приложение — помощник, а не судья: оно подсказывает, но никогда не запрещает. Пока идёт партия, ничего не решается. До первого хода каждый запечатывает свой лабиринт. Когда партия кончится, вы покажете друг другу, что было внутри, и печати сверят.","rules.quickStart.title":"Как проходит партия","rules.quickStart.intro":"Вся партия целиком: от «сели играть» до «знаем, кто выиграл».","rules.quickStart.step1":"Договоритесь о настройках. Один создаёт код настроек и отправляет его, второй вставляет.","rules.quickStart.step2":"Постройте свой лабиринт на левой доске: вход, выход и стены между клетками.","rules.quickStart.step3":"Скажите друг другу, где у вас вход и выход, и отметьте чужие на правой доске. Эти две клетки не секрет — секрет стены.","rules.quickStart.step4":"Зафиксируйте лабиринт. Приложение запечатает его, выдаст код печати и попросит сохранить файл раскрытия. Сохраните.","rules.quickStart.step5":"Отправьте свой код печати и вставьте присланный. Он проверяется сразу при вставке.","rules.quickStart.step6":"Играйте. Вы называете свой шаг вслух, соперник отвечает, проход там или стена.","rules.quickStart.step7":"Когда партия окончена, обменяйтесь строками раскрытия из сохранённых файлов.","rules.quickStart.step8":"Вставьте присланное раскрытие. Отчёт проиграет всю партию заново по запечатанному лабиринту и скажет, что нашёл.","rules.quickStart.codes":"Ничто здесь не ходит в сеть. Каждый код, который вы «отправляете», вы отправляете сами — в мессенджере, в чате, вслух по звонку. Приложение только собирает эти коды и проверяет те, что вы вставляете обратно.","rules.board.title":"Поле и ваш лабиринт","rules.board.grid":"Поле — шесть клеток на шесть. Строки помечены буквами A–F сверху вниз, столбцы — цифрами 1–6 слева направо, так что C3 — третья строка, третий столбец. Ходят вверх, вниз, влево и вправо, по диагонали нельзя.","rules.board.walls":"Стена стоит на ребре между двумя соседними клетками, а не внутри клетки, и закрывает путь в обе стороны. Таких рёбер шестьдесят. Внешняя граница глухая везде: с поля не уйти, и стены там не ставят.","rules.board.limit":"У вас есть запас стен — по умолчанию двадцать, и это одна из настроек, о которых договариваются. Тратить его целиком не обязательно.","rules.board.ends":"В вашем лабиринте ровно один вход и ровно один выход, и это разные клетки. Обе вы выбираете сами и называете вслух до партии: сопернику надо знать, откуда пойдёт его фишка и куда.","rules.board.path":"От вашего входа до вашего выхода должен быть хотя бы один путь. Тупики и запертые карманы — пожалуйста. Лабиринт, который не пройти, — это не лабиринт, а стена с украшениями.","rules.board.invalid":"Партия не начнётся на лабиринте, который нарушает что-то из этого: нет входа или выхода, оба на одной клетке, стен больше запаса, вход или выход замурованы со всех сторон, нет пути от одного до другого. Всё неправильное показывается сразу списком, чтобы поправить за один заход.","rules.turn.title":"Ваш ход","rules.turn.first":"Кто ходит первым, решают настройки. Ваша фишка стоит на входе соперника и идёт к его выходу; его фишка стоит на вашем входе и идёт к вашему. По своему лабиринту не ходит никто — вы и так знаете, где ваши стены.","rules.turn.step":"Шаг — одно перемещение на соседнюю клетку. Вы называете его вслух, а соперник отвечает, что там: проход или стена. Записывают оба и за обе стороны — свои шаги на правой доске, шаги соперника на левой, — поэтому вся партия есть на каждом устройстве.","rules.turn.clock":"Таймеры здесь только для того, чтобы на них смотреть. Ни таймер постройки, ни таймер хода ничего не запрещают и ничего не заканчивают: истёкшее время не стоит вам ничего.","rules.turn.rightBoard":"Правая доска сначала пустая и заполняется по ходу дела: на ней видно только то, что вы разведали сами, — клетки, где стояли, проходы, через которые прошли, стены, в которые упёрлись. Это медленное проявление и есть игра.","rules.turn.theirTurn":"Свой шаг соперник называет вслух, а отвечаете вы: ваш лабиринт видите только вы. На своём устройстве вы вводите лишь направление, которое он назвал вслух, — ваши стены уже здесь, и ответ выводится сам.","rules.turn.end":"Сам по себе ход не заканчивается. Когда вы прошли, сколько хотели, или приложение говорит, что ход технически окончен, вы передаёте ход — именно это записывает его в партию и отдаёт очередь. Есть тумблер, который передаёт ход сам, как только он технически окончен; это удобство вашего устройства и на правила не влияет.","rules.turn.newCells":"На ход даётся по умолчанию три новые клетки. Шаг на клетку, где вы ещё не стояли, тратит одну; когда они кончились, ход окончен.","rules.turn.wall":"Стена заканчивает ход сразу. Фишка остаётся на месте, стена отмечается на доске у обоих, и новых клеток это не стоит. Узнать, где стена, — ровно то, ради чего ход и делается.","rules.turn.visited":"Ходить по клеткам, где вы уже стояли, не стоит ничего. Считается только новая земля, так что возвращаться по своим следам можно спокойно.","rules.turn.known":"Приложение помнит все ответы, поэтому соперника не спрашивают дважды об одном и том же. Проход, через который вы уже проходили, просто делается. Известную стену сначала предлагают подтвердить: такой шаг заканчивает ход, и промах мышью не должен стоить хода.","rules.turn.override":"Если соперник ответил иначе, чем в прошлый раз, — люди путают, — рядом с шагом, отвеченным по памяти, есть неприметная возможность спросить заново. Прежний шаг при этом отменяется, и в записи остаются оба: и шаг, и поправка.","rules.turn.pass":"Пропустить ход нельзя, если настройки не разрешили. Пропуск всё равно считается ходом: он увеличивает ваш счёт и входит в общий лимит партии.","rules.turn.undo":"Шаг можно отменить, пока ход не закрыт; после передачи хода отменяется только ход целиком. Ничего не стирается — в записи рядом стоят и сделанное, и отменённое, чтобы вы вдвоём всегда видели, как было на самом деле.","rules.end.title":"Чем заканчивается партия","rules.end.exit":"Достижение выхода партию не заканчивает. Записывается ход, на котором вы впервые оказались на выходе, и это число потом решает итог.","rules.end.limit":"По умолчанию партия ограничена 150 ходами на двоих. Приложение скажет, когда лимит достигнут.","rules.end.afterExit":"Как сравнивать два финиша, решает одна настройка. Если «партия продолжается после достижения выхода» включена, считается круг, в котором каждый дошёл, — круг это по одному ходу с каждой стороны, — и одинаковый круг означает ничью. Если выключена, решает точный номер хода, и ничья невозможна.","rules.end.resign":"Можно сдаться. Это делается в два нажатия и не отменяется: сдача — объявление, а не ход.","rules.end.resignThem":"Если сдача прозвучала вслух, запишите её и у себя. Сдача, которую никто не записал, — это сдача, которой проверка не увидит, и вердикт выйдет такой, будто партия просто оборвалась.","rules.end.again":"После отчёта появляется способ начать новую партию с теми же настройками. Пользуйтесь им: он берёт новый номер партии, а с ним и новый код настроек, который надо отправить сопернику до того, как кто-то начнёт строить. Сыграете реванш по старому коду — третья проверка в конце не сойдётся, и партия пропадёт целиком.","rules.end.verdict":"Пока идёт партия, ничего не решается. Итог считается на этапе проверки, из запечатанных лабиринтов и данных ответов.","rules.commit.title":"Как лабиринт запечатывают и как показывают потом","rules.commit.why":"Врать про свои стены нельзя, но играть было бы невозможно, если бы это никак не проверялось. Поэтому до первого хода каждый запечатывает свой лабиринт: приложение берёт лабиринт, настройки и случайное число и сводит их в один короткий код — печать.","rules.commit.nothing":"Печать ничего не выдаёт: прочитать по ней ваши стены нельзя. Она делает другое — привязывает вас к тому лабиринту, который у вас есть. Придумать потом лабиринт, подходящий к уже отправленному коду, невозможно.","rules.commit.envelope":"Проще всего думать про конверт. Печать — это сургуч снаружи: сопернику вы отправляете оттиск, по нему о письме не узнать ничего, а подменить письмо потом, не сломав печать, нельзя. Раскрытие — само письмо. Две разные вещи, сделанные в один момент на одном экране: одну отправляют, другую сохраняют.","rules.commit.which":"Код печати уходит сопернику до первого хода, а его код приходит вам. Файл раскрытия ложится на ваш собственный диск и лежит там, пока партия не проверена: его никуда не отправляют, и за всю партию его не видит никто, кроме вас.","rules.commit.exchange":"Печатями обмениваются до первого хода, и каждая проверяется сразу при вставке. Код, потерявший символ по дороге, ловится тут же, пока можно просто попросить прислать заново, — а не в конце партии, где сломанный код выглядит куда хуже.","rules.commit.file":"Раскрытие — это ваш лабиринт и то самое случайное число, выписанные полностью. Приложение заставляет сохранить его файлом до начала партии, потому что случайное число не хранится больше нигде: ни на сервере, ни в отправленном коде — только в этом файле и в этом браузере.","rules.commit.lost":"Потеряете файл и очистите страницу — раскрыться будет нечем. По правилам не раскрывшийся проигрывает. Держите файл, пока партия не проверена и вы оба не согласились с итогом.","rules.commit.after":"Когда партия окончена, обменяйтесь строками раскрытия. После этого каждый может проверить другого, и изменить уже никто ничего не может.","rules.verify.title":"Проверка в конце","rules.verify.intro":"Вставьте присланное раскрытие, и по порядку пройдут семь проверок. У каждой видно, что она нашла.","rules.verify.check1":"строка дошла целой: ничего не потеряно, контрольная сумма сходится.","rules.verify.check2":"лабиринт в раскрытии — тот самый, который был запечатан до первого хода.","rules.verify.check3":"вы оба играли по одним и тем же согласованным настройкам и под одним номером партии.","rules.verify.check4":"вход и выход — те, что были названы вслух.","rules.verify.check5":"раскрытый лабиринт валиден по правилам: запас стен, открытые концы, путь насквозь.","rules.verify.check6":"каждый ответ, данный за партию, проигрывается заново по раскрытому лабиринту, ход за ходом.","rules.verify.check7":"итог партии, посчитанный из всего перечисленного.","rules.verify.damaged":"Строка, не прошедшая первую проверку, испортилась по дороге: скопировали не до конца, мессенджер перенёс, символ выпал. Это не обвинение, и приложение так к этому и относится — попросите прислать строку заново.","rules.verify.commitFailed":"Если печать не сошлась, приложение говорит ровно это: либо строку ввели с ошибкой, либо раскрытый лабиринт не тот, что был запечатан. Что именно из двух — отсюда не видно никому.","rules.verify.mismatch":"Расхождение в шестой проверке означает, что ответ, данный за партию, не сходится с раскрытым лабиринтом: стена там, где в лабиринте проход, или проход там, где стена. Повторы по одному ребру собираются в одну строку, потому что один неверный ответ про ходовое ребро всплывает при каждом проходе через него. По правилам пойманный так проигрывает партию.","rules.verify.replay":"Под отчётом всю партию можно пройти заново, ход за ходом, по лабиринту, каким он был на самом деле.","rules.limits.title":"Чего это не может","rules.limits.intro":"Печать делает невозможной одну определённую ложь. Она не делает игру нерушимой, и полезно знать, где она заканчивается.","rules.limits.noReveal":"Если соперник так и не пришлёт раскрытие, доказать нельзя ничего. Приложение видит пустое поле и больше ничего. По правилам не раскрывшийся проигрывает, и это можно записать кнопкой — прямо подписанной как ваше заявление, а не как посчитанный итог.","rules.limits.dispute":"Всё сказанное за партию записывается только на вашем устройстве. Если потом вы разойдётесь в том, кто что говорил, никакая проверка этого не решит: нет ни сервера, ни общей записи.","rules.limits.lostFile":"Потерянный файл раскрытия не восстановить ниоткуда. Случайное число из него больше нигде не хранится.","rules.glossary.title":"Четыре слова","rules.glossary.settingsCodeTerm":"Код настроек","rules.glossary.settingsCode":"Короткий код, несущий согласованные настройки и номер этой конкретной партии. У обоих он должен быть один и тот же.","rules.glossary.commitTerm":"Печать","rules.glossary.commit":"Печать вашего лабиринта, отправляется до первого хода. Про стены она не говорит ничего, и подогнать её под другой лабиринт нельзя.","rules.glossary.revealTerm":"Раскрытие","rules.glossary.reveal":"Ваш лабиринт и его случайное число, выписанные полностью; отправляется после партии. Именно с ним сверяют печать.","rules.glossary.saltTerm":"Соль","rules.glossary.salt":"Случайное число, входящее в печать. Без него два одинаковых лабиринта давали бы одну печать, и лабиринт можно было бы найти простым перебором."};var Lr={"lang.name":"Українська","app.title":"Usogui Maze yev","app.subtitle":"Два пристрої, по лабіринту на кожному, і хеш, який тримає обох чесними.","app.stepSetup":"Налаштування","app.stepBuild":"Побудова","app.stepPlay":"Партія","app.stepVerify":"Перевірка","app.stages":"Етапи партії","app.interfaceTitle":"Інтерфейс","app.rainToggle":"Код, що падає","app.rainHint":"Дощ на тлі. Зупиняється сам, коли вкладку не видно.","app.crtToggle":"Ефекти екрана","app.crtHint":"Скан-лінії та затемнені кути. Вимкніть, якщо текст читати важко.","app.soundToggle":"Звук","app.soundHint":"Чотири короткі тони: крок, стіна, передача ходу, вихід. Типово вимкнений: ви розмовляєте одне з одним.","ink.toggle":"Малювання","ink.hint":"Малюйте поверх дошок пальцем або мишею. Поки увімкнено, гра під малюнком призупинена; після вимкнення малюнки лишаються.","ink.colour":"Пензель","ink.width":"Товщина","ink.undo":"Скасувати штрих","ink.clear":"Очистити від малюнків","ink.full":"Місця для малюнків більше немає. Скасуйте штрих або очистіть.","colours.title":"Кольори дошки","colours.hint":"Це ваші кольори, а не теми: після зміни теми вони лишаються і переживають оновлення полів. Незадані поля йдуть за темою.","colours.resetAll":"Повернути кольори теми","colours.resetField":"Скинути","colours.themeChanged":"Ці кольори добиралися під іншу тему й можуть не пасувати цій. Скиньте їх — або лишіть, якщо читаються.","colours.lowContrast":"{name}: {ratio}:1 до дошки — розгледіти важко.","colours.wallsAlike":"Свої стіни й стіни, в які ви впиралися, стали однакові на вигляд. Це різні речі: одна — ваш лабіринт, інша — місце, де ви втратили хід.","colours.entrance":"Вхід","colours.exit":"Вихід","colours.tokenMe":"Моя фішка","colours.tokenOpponent":"Фішка суперника","colours.wall":"Своя стіна","colours.wallFound":"Знайдена стіна","colours.passage":"Слід проходу","colours.grid":"Сітка","colours.label":"Координати","colours.boardBg":"Тло поля","app.theme":"Тема","theme.xp-cyber":"XP-кіберпанк","theme.dark":"Темна","theme.light":"Світла","theme.paper":"Папір і фарба","theme.amber":"Бурштиновий монітор","app.language":"Мова","app.languageHint":"Перемикається одразу, на весь інтерфейс. Вибір переживає оновлення полів.","app.autoEndToggle":"Автоматично передавати хід","app.autoEndHint":"Коли крок завершує хід - стіна або третя нова клітинка, - хід іде до суперника без окремого натискання. Це ваше рішення, ухвалене заздалегідь; правила не змінюються, а в суперника налаштування може стояти інакше.","export.title":"Зберегти цю партію","export.hint":"Картинка — обидві дошки як є, разом з малюнками. Архів — уся партія текстом, для читання: назад застосунок його не завантажує.","export.png":"Зберегти дошки (PNG)","export.json":"Зберегти архів (JSON)","export.failed":"Зібрати картинку не вдалося: {message}","app.repository":"Вихідний код на GitHub","app.rules":"Правила","app.reset":"Оновити поля","app.resetConfirm":"Стерти все","app.resetWhat":"Буде стерто обидва лабіринти, усі стіни, входи та виходи, усю партію з історією і лічильниками, печатку, сіль, печатку суперника та позначку про збережений файл розкриття. Роль, мова й перемикачі інтерфейсу залишаться.","app.resetFile":"Файл розкриття, уже збережений на диск, нікуди не зникне, але він від партії, яку ви стираєте, і до наступної не підійде.","app.storageNotice":"Цей пристрій памʼятає вашу підготовку в браузері. На сторінці file:// це сховище може бути спільним з усіма іншими локальними сторінками, тож покладатися варто лише на збережений файл розкриття.","app.storageUnavailable":"Цей браузер не дає тут локального сховища, тож між перезавантаженнями нічого не зберігається. Збережіть файл розкриття: тільки він переживе закриту вкладку.","board.label":"Дошка лабіринту","board.cellLabel":"Клітинка {cell}","board.edgeLabel":"Стіна між {from} і {to}","code.copy":"Копіювати","code.copied":"Скопійовано.","code.copyManually":"Копіювання тут заборонено. Код виділено — натисніть Ctrl+C.","code.empty":"Ще не створено","code.accepted":"Код прийнято.","error.BAD_FORMAT":"Це код не того виду або вставлений не повністю.","error.BAD_CHECKSUM":"Код пошкоджено під час копіювання. Попросіть надіслати його ще раз.","error.OUT_OF_RANGE":"У коді є значення поза дозволеним діапазоном. Його зібрала програма, яка не дотримується специфікації.","error.UNKNOWN":"Код не вдалося прочитати.","error.WRONG_KIND_SETTINGS":"Це код налаштувань, а не розкриття. Він починається з YM1.","error.WRONG_KIND_COMMIT":"Це код печатки, а не розкриття. Він починається з YMC1.","error.OWN_REVEAL":"Це ваше власне розкриття, а не суперника. Нічого не перевірено. Вставте рядок, який надіслали вам, — свій ви надсилаєте суперникові.","validate.title":"Перевірка лабіринту","validate.pending":"Перевіряти поки нічого.","validate.ok":"Лабіринт валідний.","validate.failed":"Лабіринт не валідний.","validate.ENTRANCE_MISSING":"Вхід не поставлено.","validate.EXIT_MISSING":"Вихід не поставлено.","validate.ENTRANCE_EQUALS_EXIT":"Вхід і вихід стоять на одній клітинці.","validate.WALL_LIMIT_EXCEEDED":"Стін більше, ніж дозволяє ліміт.","validate.ENTRANCE_SEALED":"У входу не лишилося жодного відкритого боку.","validate.EXIT_SEALED":"У виходу не лишилося жодного відкритого боку.","validate.NO_PATH":"Від входу до виходу немає шляху.","validate.NO_PATH_consequence":"Від входу до виходу немає шляху — наслідок замурованої клітинки вище.","validate.UNKNOWN":"Ядро повідомило про проблему, якої ця версія не знає.","settings.range":"дозволено {min}…{max}","settings.outOfRange":"Потрібне ціле число від {min} до {max}.","settings.wall_limit":"Ліміт стін","settings.new_cells_per_turn":"Нових клітинок за хід","settings.move_limit_total":"Загальний ліміт ходів","settings.allow_pass":"Пропускати хід дозволено","settings.play_after_exit":"Партія триває після досягнення виходу","settings.timers_visible":"Показувати таймери","settings.build_timer_sec":"Таймер побудови, секунди","settings.turn_timer_sec":"Таймер ходу, секунди","settings.first_move":"Перший хід","settings.grid_w":"Ширина поля","settings.grid_h":"Висота поля","settings.exits_count":"Виходів","settings.hint.wall_limit":"Скільки стін може поставити кожен. Витрачати всі не обовʼязково.","settings.hint.new_cells_per_turn":"Хід технічно завершено, коли відкрито стільки жодного разу не відвіданих клітинок.","settings.hint.move_limit_total":"Рахується на двох. 0 — без ліміту.","settings.hint.allow_pass":"Типово вимкнено: інакше той, хто відстає, може пасувати, доки не скінчиться ліміт ходів.","settings.hint.play_after_exit":"Увімкнено: обидва догрують коло, і однакове коло — нічия. Вимкнено: перемагає раніший хід.","settings.hint.timers_visible":"Таймери — прикраса. Вони нічого не блокують.","settings.hint.build_timer_sec":"Цокає на екрані побудо у","verify.myRevealPasteHint":"Файл — звичайний текст; потрібен рядок, що починається з YMR1.","verify.myRevealPasteAccepted":"Це чинний рядок розкриття. Надішліть його суперникові.","verify.saveAgain":"Зберегти файл ще раз","verify.noRevealRule":"Той, хто не розкрився, програє за правилами, тож не втратьте цей файл до обміну.","verify.theirRevealTitle":"Розкриття суперника","verify.theirRevealLabel":"Вставте надісланий рядок розкриття","verify.theirRevealHint":"Він перевіряється одразу під час вставки.","verify.theirRevealAccepted":"Рядок розкриття цілий. Звіт нижче.","verify.noReveal":"Суперник нічого не надіслав","verify.noRevealConfirm":"Записати, що нічого не прийшло","verify.noRevealWarning":"Натисніть ще раз, щоб це записати. Переконайтеся, що ви справді дочекалися, — перевірити це більше нікому.","verify.noRevealDeclared":"Ви записали, що розкриття не прийшло.","verify.noRevealNotProof":"Це ваша заява, а не перевірка. Застосунок не може побачити, надсилали розкриття чи ні; за правилами той, хто не розкрився, програє, і рядок вище говорить саме це.","verify.noCommitTitle":"Звіряти немає з чим","verify.noCommitText":"На цей пристрій так і не потрапив код печатки суперника, тож розкриття немає з чим порівняти. Печатка — це код YMC1, надісланий до першого ходу; введіть його на екрані побудови й повертайтеся.","verify.subject":"Перевіряється печатка {commit} · оголошено вхід {entrance} і вихід {exit} · налаштування {settings}","verify.gameRunning":"Партія ще триває — ніхто не здався. Усе, що нижче, пораховано за зробленими ходами, і вердикт змінюватиметься далі. Перевірка зараз нічого не доводить про решту партії.","verify.passedSummary":"Пройдено перевірок: {count}","verify.reviewedTitle":"Цю партію розібрано","verify.reviewedText":"Звіт вище. Більше з цією партією робити нічого: зберігайте файл розкриття, доки обидва не погодитеся з підсумком.","verify.nextGame":"Нова партія, ті самі правила","verify.nextGameWarning":"У нової партії новий номер, а отже й новий код налаштувань — надішліть його суперникові до побудови. Пропустите це, і третя перевірка наприкінці не збіжиться: партію обидва зіграєте намарно.","verify.reportTitle":"Звіт","verify.reportEmpty":"Вставте надісланий рядок розкриття, і тут пройдуть сім перевірок.","verify.mismatchLine":"{from}-{to}: сказано {declared}, у розкритому лабіринті {actual}. Разів: {count}.","verify.mismatchMoves":"ходи ({count})","verify.wordWall":"стіна","verify.wordPass":"прохід","verify.myBoardTitle":"Мій лабіринт","verify.theirBoardTitle":"Лабіринт суперника","verify.theirBoardHint":"Після успішної перевірки лабіринт малюється повністю, а поверх — те, що ви розвідали за партію. Ребра, де відповідь не збіглася, підсвічені.","verify.replayTitle":"Реплей","verify.replayHint":"Пройдіть завершену партію крок за кроком. Тут нічого не змінюється.","verify.replayStart":"На початок","verify.replayBack":"Назад","verify.replayForward":"Вперед","verify.replayPlay":"Програти","verify.replayPause":"Пауза","verify.replayEnd":"У кінець","verify.replayAt":"дія {at} з {total}","verify.noGameTitle":"На цьому пристрої немає завершеної партії","verify.noGameText":"Звітові потрібна партія, якої він стосується. Зіграйте партію або відновіть цей пристрій з екрана налаштувань.","check.CODE_INTEGRITY":"Сам код розкриття","check.COMMIT_MATCH":"Печатка","check.SETTINGS_MATCH":"Налаштування","check.ENDPOINTS_MATCH":"Оголошені вхід і вихід","check.MAZE_VALID":"Лабіринт валідний за правилами","check.LOG_REPLAY":"Усі відповіді, програні заново","check.VERDICT":"Вердикт","check.ok":"Збігається.","check.computed":"обчислено","check.skipped.EARLIER_CHECK":"Пропущено: не пройшла попередня перевірка, тож ця нічого б не довела.","check.skipped.NO_GAME":"Пропущено: на цьому пристрої немає завершеної партії, щоб судити.","check.fail.DAMAGED":"Код пошкоджено під час копіювання. Попросіть надіслати його ще раз.","check.fail.NOT_A_REVEAL":"Це не рядок розкриття або він вставлений не повністю.","check.fail.COMMIT":"Печатка не збіглася: або код введено з помилкою, або лабіринт не той, на який давали печатку.","check.fail.SETTINGS":"Налаштування всередині розкриття — не ті, за якими грали цю партію.","check.fail.ENDS":"Оголошені були {declaredEntrance} і {declaredExit}; у розкритті стоять {revealedEntrance} і {revealedExit}.","check.fail.MAZE":"Розкритий лабіринт порушує правила, яких лабіринт має дотримуватися.","check.fail.ANSWERS":"Відповідей, що не збіглися з розкритим лабіринтом: {count}.","check.fail.UNKNOWN":"Ця перевірка не пройшла.","status.ok":"збіглося","status.fail":"не збіглося","status.skipped":"пропущено","verdict.win":"Ви виграли","verdict.loss":"Ви програли","verdict.draw":"Нічия","verdict.bothLose":"Програли обидва","verdict.none":"Вердикту немає","verdict.reason.VIOLATION":"Перевірка не пройшла, і за правилами це вирішує партію.","verdict.reason.BOTH_VIOLATED":"Жодне розкриття не витримало перевірки.","verdict.reason.RESIGN":"Через здачу.","verdict.reason.BOTH_RESIGNED":"Здалися обидва.","verdict.reason.NO_EXIT_REACHED":"До виходу не дійшов ніхто.","verdict.reason.ONLY_ONE_REACHED_EXIT":"До свого виходу дійшла лише одна фішка.","verdict.reason.SAME_ROUND":"Обидва дійшли до виходу в одному колі.","verdict.reason.EARLIER_ROUND":"До виходу дійшли в ранішому колі.","verdict.reason.EARLIER_MOVE":"До виходу дійшли на ранішому ході.","verdict.reason.UNKNOWN":"Ядро назвало причину, якої ця версія не знає.","rules.title":"Правила","rules.close":"Назад","rules.intro":"Кожен будує свій лабіринт, а потім наосліп іде чужим: ви називаєте крок, суперник каже, прохід там чи стіна, і ви поступово складаєте карту його лабіринту. Перемога — провести свою фішку від його входу до його виходу раніше, ніж суперник зробить те саме у вашому. Одне правило важливіше за решту: брехати про свої стіни не можна. Застосунок — помічник, а не суддя: він підказує, але ніколи не забороняє. Поки триває партія, нічого не вирішується. До першого ходу кожен запечатує свій лабіринт. Коли партія скінчиться, ви покажете одне одному, що було всередині, і печатки звірять.","rules.quickStart.title":"Як минає партія","rules.quickStart.intro":"Уся партія цілком: від «сіли грати» до «знаємо, хто виграв».","rules.quickStart.step1":"Домовтеся про налаштування. Один створює код налаштувань і надсилає його, другий вставляє.","rules.quickStart.step2":"Побудуйте свій лабіринт на лівій дошці: вхід, вихід і стіни між клітинками.","rules.quickStart.step3":"Скажіть одне одному, де у вас вхід і вихід, і позначте чужі на правій дошці. Ці дві клітинки не таємниця — таємниця стіни.","rules.quickStart.step4":"Зафіксуйте лабіринт. Застосунок запечатає його, видасть код печатки й попросить зберегти файл розкриття. Збережіть.","rules.quickStart.step5":"Надішліть свій код печатки і вставте надісланий. Він перевіряється одразу під час вставки.","rules.quickStart.step6":"Грайте. Ви називаєте свій крок уголос, суперник відповідає, прохід там чи стіна.","rules.quickStart.step7":"Коли партію завершено, обміняйтеся рядками розкриття зі збережених файлів.","rules.quickStart.step8":"Вставте надіслане розкриття. Звіт програє всю партію заново за запечатаним лабіринтом і скаже, що знайшов.","rules.quickStart.codes":"Ніщо тут не ходить у мережу. Кожен код, який ви «надсилаєте», ви надсилаєте самі — у месенджері, в чаті, вголос під час дзвінка. Застосунок лише збирає ці коди й перевіряє ті, що ви вставляєте назад.","rules.board.title":"Поле і ваш лабіринт","rules.board.grid":"Поле — шість клітинок на шість. Рядки позначені літерами A–F згори вниз, стовпці — цифрами 1–6 зліва направо, тож C3 — третій рядок, третій стовпець. Ходять угору, вниз, ліворуч і праворуч, по діагоналі не можна.","rules.board.walls":"Стіна стоїть на ребрі між двома сусідніми клітинками, а не всередині клітинки, і закриває шлях в обидва боки. Таких ребер шістдесят. Зовнішня межа глуха всюди: з поля не вийти, і стіни там не ставлять.","rules.board.limit":"У вас є запас стін — типово двадцять, і це одне з налаштувань, про які домовляються. Витрачати його повністю не обовʼязково.","rules.board.ends":"У вашому лабіринті рівно один вхід і рівно один вихід, і це різні клітинки. Обидві ви обираєте самі й називаєте вголос до партії: суперникові треба знати, звідки піде його фішка й куди.","rules.board.path":"Від вашого входу до вашого виходу має бути принаймні один шлях. Глухі кути й замкнені кишені — будь ласка. Лабіринт, яким не пройти, — це не лабіринт, а стіна з прикрасами.","rules.board.invalid":"Партія не почнеться на лабіринті, який порушує щось із цього: немає входу чи виходу, обидва на одній клітинці, стін більше за запас, вхід або вихід замуровані з усіх боків, немає шляху від одного до другого. Усе неправильне показується одразу списком, щоб виправити за один захід.","rules.turn.title":"Ваш хід","rules.turn.first":"Хто ходить першим, вирішують налаштування. Ваша фішка стоїть на вході суперника й прямує до його виходу; його фішка стоїть на вашому вході й прямує до вашого виходу. Своїм лабіринтом не ходить ніхто — ви й так знаєте, де ваші стіни.","rules.turn.step":"Крок — одне переміщення на сусідню клітинку. Ви називаєте його вголос, а суперник відповідає, що там: прохід чи стіна. Записують обидва й за обидві сторони — свої кроки на правій дошці, кроки суперника на лівій, — тому вся партія є на кожному пристрої.","rules.turn.clock":"Таймери тут лише для того, щоб на них дивитися. Ані таймер побудови, ані таймер ходу нічого не забороняють і нічого не завершують: вичерпаний час не коштує вам нічого.","rules.turn.rightBoard":"Права дошка спершу порожня й заповнюється дорогою: на ній видно тільки те, що ви розвідали самі, — клітинки, де стояли, проходи, якими пройшли, стіни, в які впиралися. Це повільне проявляння і є гра.","rules.turn.theirTurn":"Свій крок суперник називає вголос, а відповідаєте ви: ваш лабіринт бачите тільки ви. На своєму пристрої ви вводите лише напрямок, який він назвав уголос, — ваші стіни вже тут, і відповідь виводиться сама.","rules.turn.end":"Сам по собі хід не завершується. Коли ви пройшли, скільки хотіли, або застосунок каже, що хід технічно завершено, ви передаєте хід — саме це записує його в партію й віддає чергу. Є перемикач, який передає хід сам, щойно той технічно завершений; це зручність вашого пристрою, і на правила вона не впливає.","rules.turn.newCells":"На хід дається типово три нові клітинки. Крок на клітинку, де ви ще не стояли, витрачає одну; коли вони скінчилися, хід завершено.","rules.turn.wall":"Стіна завершує хід одразу. Фішка лишається на місці, стіна позначається на дошці в обох, і нових клітинок це не коштує. Дізнатися, де стіна, — саме те, заради чого хід і робиться.","rules.turn.visited":"Ходити клітинками, де ви вже стояли, не коштує нічого. Рахується тільки нова земля, тож повертатися своїми слідами можна спокійно.","rules.turn.known":"Застосунок памʼятає всі відповіді, тож суперника не питають двічі про одне й те саме. Прохід, яким ви вже проходили, просто робиться. Відому стіну спершу пропонують підтвердити: такий крок завершує хід, і промах мишею не має коштувати ходу.","rules.turn.override":"Якщо суперник відповів інакше, ніж минулого разу, — люди плутають, — поруч із кроком, відповіданим по памʼяті, є непомітна можливість спитати ще раз. Попередній крок при цьому скасовується, і в записі лишаються обидва: і крок, і поправка.","rules.turn.pass":"Пропустити хід не можна, якщо налаштування не дозволили. Пропуск однаково рахується ходом: він збільшує ваш лік і входить у загальний ліміт партії.","rules.turn.undo":"Крок можна скасувати, доки хід не закрито; після передачі ходу скасовується тільки хід цілком. Нічого не стирається — у записі поруч стоять і зроблене, і скасоване, щоб ви удвох завжди бачили, як було насправді.","rules.end.title":"Чим завершується партія","rules.end.exit":"Досягнення виходу партію не завершує. Записується хід, на якому ви вперше опинилися на виході, і це число потім вирішує підсумок.","rules.end.limit":"Типово партія обмежена 150 ходами на двох. Застосунок скаже, коли ліміту досягнуто.","rules.end.afterExit":"Як порівнювати два фініші, вирішує одне налаштування. Якщо «партія триває після досягнення виходу» увімкнена, рахується коло, в якому дійшов кожен, — коло це по одному ходу з кожного боку, — і однакове коло означає нічию. Якщо вимкнена, вирішує точний номер ходу, і нічия неможлива.","rules.end.resign":"Можна здатися. Це робиться у два натискання й не скасовується: здача — оголошення, а не хід.","rules.end.resignThem":"Якщо здача прозвучала вголос, запишіть її і в себе. Здача, якої ніхто не записав, — це здача, якої перевірка не побачить, і вердикт вийде такий, наче партія просто обірвалася.","rules.end.again":"Після звіту зʼявляється спосіб почати нову партію з тими самими налаштуваннями. Користуйтеся ним: він бере новий номер партії, а з ним і новий код налаштувань, який треба надіслати суперникові, перш ніж хтось почне будувати. Зіграєте реванш за старим кодом — третя перевірка наприкінці не збіжиться, і партія пропаде цілком.","rules.end.verdict":"Поки триває партія, нічого не вирішується. Підсумок обчислюють на етапі перевірки, із запечатаних лабіринтів і з даних відповідей.","rules.commit.title":"Як лабіринт запечатують і як показують потім","rules.commit.why":"Брехати про свої стіни не можна, але грати було б неможливо, якби це ніяк не перевірялося. Тому до першого ходу кожен запечатує свій лабіринт: застосунок бере лабіринт, налаштування й випадкове число і зводить їх в один короткий код — печатку.","rules.commit.nothing":"Печатка нічого не видає: прочитати за нею ваші стіни не вийде. Вона робить інше — привʼязує вас до того лабіринту, який у вас є. Вигадати потім лабіринт, що підійде до вже надісланого коду, неможливо.","rules.commit.envelope":"Найпростіше думати про конверт. Печатка — це сургуч зовні: суперникові ви надсилаєте відбиток, з нього про лист не дізнатися нічого, а підмінити лист потім, не зламавши печатку, не вийде. Розкриття — сам лист. Дві різні речі, зроблені в одну мить на одному екрані: одну надсилають, другу зберігають.","rules.commit.which":"Код печатки йде суперникові до першого ходу, а його код приходить вам. Файл розкриття лягає на ваш власний диск і лежить там, доки партію не перевірено: його нікуди не надсилають, і за всю партію його не бачить ніхто, крім вас.","rules.commit.exchange":"Печатками обмінюються до першого ходу, і кожну перевіряють одразу під час вставки. Код, що загубив символ дорогою, ловиться тут же, поки можна просто попросити надіслати ще раз, — а не наприкінці партії, де зламаний код має куди гірший вигляд.","rules.commit.file":"Розкриття — це ваш лабіринт і те саме випадкове число, виписані повністю. Застосунок змушує зберегти його файлом до початку партії, бо випадкове число не зберігається більше ніде: ні на сервері, ні в надісланому коді — тільки в цьому файлі й у цьому браузері.","rules.commit.lost":"Втратите файл і очистите сторінку — розкритися буде нічим. За правилами той, хто не розкрився, програє. Тримайте файл, доки партію не перевірено і ви обидва не погодилися з підсумком.","rules.commit.after":"Коли партію завершено, обміняйтеся рядками розкриття. Після цього кожен може перевірити другого, і змінити вже ніхто нічого не може.","rules.verify.title":"Перевірка наприкінці","rules.verify.intro":"Вставте надіслане розкриття, і по порядку пройдуть сім перевірок. У кожної видно, що вона знайшла.","rules.verify.check1":"рядок дійшов цілим: нічого не загублено, контрольна сума збігається.","rules.verify.check2":"лабіринт у розкритті — саме той, який запечатали до першого ходу.","rules.verify.check3":"ви обидва грали за одними й тими самими узгодженими налаштуваннями і під одним номером партії.","rules.verify.check4":"вхід і вихід — ті, які назвали вголос.","rules.verify.check5":"розкритий лабіринт валідний за правилами: запас стін, відкриті кінці, шлях наскрізь.","rules.verify.check6":"кожну відповідь, дану за партію, програють заново за розкритим лабіринтом, хід за ходом.","rules.verify.check7":"підсумок партії, обчислений з усього переліченого.","rules.verify.damaged":"Рядок, що не пройшов першу перевірку, зіпсувався дорогою: скопіювали не до кінця, месенджер переніс, символ випав. Це не звинувачення, і застосунок так до цього й ставиться — попросіть надіслати рядок ще раз.","rules.verify.commitFailed":"Якщо печатка не збіглася, застосунок каже рівно це: або рядок ввели з помилкою, або розкритий лабіринт не той, що був запечатаний. Що саме з двох — звідси не видно нікому.","rules.verify.mismatch":"Розбіжність у шостій перевірці означає, що відповідь, дана за партію, не збігається з розкритим лабіринтом: стіна там, де в лабіринті прохід, або прохід там, де стіна. Повтори по одному ребру збираються в один рядок, бо одна хибна відповідь про ходове ребро зринає щоразу, коли хтось ним проходить. За правилами спійманий так програє партію.","rules.verify.replay":"Під звітом усю партію можна пройти заново, хід за ходом, за лабіринтом, яким він був насправді.","rules.limits.title":"Чого це не може","rules.limits.intro":"Печатка робить неможливою одну певну брехню. Вона не робить гру незламною, і корисно знати, де вона закінчується.","rules.limits.noReveal":"Якщо суперник так і не надішле розкриття, довести не вийде нічого. Застосунок бачить порожнє поле й більше нічого. За правилами той, хто не розкрився, програє, і це можна записати кнопкою — прямо підписаною як ваша заява, а не як обчислений підсумок.","rules.limits.dispute":"Усе сказане за партію записується тільки на вашому пристрої. Якщо потім ви розійдетеся в тому, хто що казав, жодна перевірка цього не вирішить: немає ні сервера, ні спільного запису.","rules.limits.lostFile":"Втрачений файл розкриття не відновити нізвідки. Випадкове число з нього більше ніде не зберігається.","rules.glossary.title":"Чотири слова","rules.glossary.settingsCodeTerm":"Код налаштувань","rules.glossary.settingsCode":"Короткий код, що несе узгоджені налаштування й номер саме цієї партії. В обох він має бути той самий.","rules.glossary.commitTerm":"Печатка","rules.glossary.commit":"
